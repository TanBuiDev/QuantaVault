schema_version: 1
problem_id: 100
contract_type: method
language_contract:
  class: Solution
  method: isSameTree
  parameters:
    - name: p
      type: TreeNode
    - name: q
      type: TreeNode
  return_type: boolean
cases:
  - name: example-1-identical
    source: problem-example
    input:
      p: [1, 2, 3]
      q: [1, 2, 3]
    expected: true
  - name: example-2-different-structure
    source: problem-example
    input:
      p: [1, 2]
      q: [1, null, 2]
    expected: false
  - name: example-3-different-values
    source: problem-example
    input:
      p: [1, 2, 1]
      q: [1, 1, 2]
    expected: false
  - name: both-empty
    source: derived-edge-case
    input:
      p: []
      q: []
    expected: true
  - name: one-empty
    source: derived-edge-case
    input:
      p: [1]
      q: []
    expected: false
  - name: deep-difference
    source: derived-regression
    input:
      p: [1, 2, 3, 4]
      q: [1, 2, 3, 5]
    expected: false
