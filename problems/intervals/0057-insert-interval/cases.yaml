schema_version: 1
problem_id: 57
contract_type: method
language_contract:
  class: Solution
  method: insert
  parameters:
    - name: intervals
      type: int[][]
    - name: newInterval
      type: int[]
  return_type: int[][]
cases:
  - name: example-1
    source: problem-example
    input:
      intervals: [[1, 3], [6, 9]]
      newInterval: [2, 5]
    expected: [[1, 5], [6, 9]]
  - name: example-2
    source: problem-example
    input:
      intervals: [[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]]
      newInterval: [4, 8]
    expected: [[1, 2], [3, 10], [12, 16]]
  - name: empty-input
    source: derived-edge-case
    input:
      intervals: []
      newInterval: [5, 7]
    expected: [[5, 7]]
  - name: insert-before-all
    source: derived-edge-case
    input:
      intervals: [[3, 5], [7, 9]]
      newInterval: [1, 2]
    expected: [[1, 2], [3, 5], [7, 9]]
  - name: insert-after-all
    source: derived-edge-case
    input:
      intervals: [[1, 2], [3, 5]]
      newInterval: [7, 9]
    expected: [[1, 2], [3, 5], [7, 9]]
  - name: new-interval-covers-all
    source: derived-regression
    input:
      intervals: [[2, 3], [5, 7], [8, 10]]
      newInterval: [1, 12]
    expected: [[1, 12]]
  - name: touching-endpoint
    source: derived-regression
    input:
      intervals: [[1, 2], [5, 7]]
      newInterval: [2, 5]
    expected: [[1, 7]]
