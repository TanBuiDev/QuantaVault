    source: problem-example
    input:
      board: [[A,B,C,E],[S,F,C,S],[A,D,E,E]]
      word: ABCCED
    expected: true
  - name: example-2
    source: problem-example
    input:
      board: [[A,B,C,E],[S,F,C,S],[A,D,E,E]]
      word: SEE
    expected: true
  - name: example-3
    source: problem-example
    input:
      board: [[A,B,C,E],[S,F,C,S],[A,D,E,E]]
      word: ABCB
    expected: false
  - name: single-cell-true
    source: derived-edge-case
    input:
      board: [[a]]
      word: a
    expected: true
  - name: cannot-reuse-cell
    source: derived-edge-case
    input:
      board: [[a,a]]
      word: aaa
    expected: false
