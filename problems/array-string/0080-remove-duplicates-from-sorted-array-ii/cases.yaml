schema_version: 1
problem_id: 80
contract_type: method
language_contract:
  class: Solution
  method: removeDuplicates
  parameters:
    - name: nums
      type: int[]
  return_type: int
cases:
  - name: example-1
    source: problem-example
    input:
      nums: [1, 1, 1, 2, 2, 3]
    expected_mutation:
      return: 5
      nums_prefix: [1, 1, 2, 2, 3]
  - name: example-2
    source: problem-example
    input:
      nums: [0, 0, 1, 1, 1, 1, 2, 3, 3]
    expected_mutation:
      return: 7
      nums_prefix: [0, 0, 1, 1, 2, 3, 3]
  - name: single-element
    source: derived-edge-case
    input:
      nums: [5]
    expected_mutation:
      return: 1
      nums_prefix: [5]
  - name: all-same
    source: derived-edge-case
    input:
      nums: [2, 2, 2, 2, 2]
    expected_mutation:
      return: 2
      nums_prefix: [2, 2]
  - name: already-within-limit
    source: derived-edge-case
    input:
      nums: [-2, -2, 0, 0, 3]
    expected_mutation:
      return: 5
      nums_prefix: [-2, -2, 0, 0, 3]
