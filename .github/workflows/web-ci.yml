name: Web CI

on:
  push:
    branches:
      - main
      - agent/web-all-in-one
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical content
        run: python tools/validate_content.py

      - name: Audit Java WHY comments
        run: python tools/audit_java_solution_comments.py

      - name: Audit solution pedagogy structure
        run: python tools/audit_solution_pedagogy.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Prepare Cloudflare Pages bundle
        working-directory: web
        run: node scripts/prepare-pages-dist.mjs

      - name: Upload Cloudflare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: web/cloudflare-pages
          retention-days: 1

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: web
        run: npx playwright test

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Cloudflare Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: cloudflare-pages

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy cloudflare-pages --project-name java-interview-v26106 --branch main --commit-dirty=true

