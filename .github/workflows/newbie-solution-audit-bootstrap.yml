name: Refresh newbie solution audit

on:
  workflow_dispatch:
  push:
    branches:
      - content/newbie-first-solutions-150
    paths:
      - tools/audit_newbie_solutions.py
      - docs/content/.refresh-newbie-audit
      - .github/workflows/newbie-solution-audit-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate deterministic 150-problem audit
        run: python tools/audit_newbie_solutions.py --write

      - name: Commit refreshed audit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content/solution-newbie-audit.json docs/content/solution-newbie-audit.md
          if git diff --cached --quiet; then
            echo "Audit reports already current."
            exit 0
          fi
          git commit -m "docs(content): refresh 150-problem newbie audit"
          git push origin HEAD:${GITHUB_REF_NAME}
