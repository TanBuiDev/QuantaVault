name: Finalize newbie audit metadata once

on:
  push:
    branches:
      - content/newbie-first-solutions-150
    paths:
      - .github/workflows/finalize-newbie-audit-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align prioritization audit golden references with final set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/audit_newbie_solutions.py')
          text = path.read_text(encoding='utf-8')
          needle = 'GOLDEN_TITLES = {\n    "Best Time to Buy and Sell Stock",\n'
          replacement = 'GOLDEN_TITLES = {\n    "Best Time to Buy and Sell Stock",\n    "H-Index",\n'
          if needle not in text:
              raise SystemExit('Could not locate GOLDEN_TITLES block')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh heuristic prioritization report
        run: python tools/audit_newbie_solutions.py --write

      - name: Recheck migration invariants
        run: |
          python tools/apply_newbie_bridges.py --check
          python tools/audit_java_solution_comments.py
          python tools/audit_solution_pedagogy.py

      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-newbie-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/audit_newbie_solutions.py docs/content/solution-newbie-audit.json docs/content/solution-newbie-audit.md
          git commit -m "docs(content): finalize 9-problem golden audit metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
