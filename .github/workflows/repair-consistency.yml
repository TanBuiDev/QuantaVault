name: One-time consistency repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Java solution heading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('problems/array-string/0121-best-time-to-buy-and-sell-stock/solution.md')
          text = path.read_text(encoding='utf-8')
          old = '## 6. Java solution overview'
          new = '## 6. Optimal Java solution'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Regenerate package lock
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit repaired consistency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/array-string/0121-best-time-to-buy-and-sell-stock/solution.md web/package-lock.json
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'chore(consistency): normalize Java heading and web lockfile'
          git push origin HEAD:main
