name: Apply curated newbie bridges once

on:
  push:
    branches:
      - content/newbie-first-solutions-150
    paths:
      - .github/workflows/apply-newbie-bridges-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply all curated bridges
        run: python tools/apply_newbie_bridges.py

      - name: Assert exactly 142 non-golden solution files changed
        shell: bash
        run: |
          set -euo pipefail
          count="$(git diff --name-only -- 'problems/*/*/solution.md' | wc -l | tr -d ' ')"
          echo "Changed solution.md files: ${count}"
          test "${count}" = "142"

      - name: Assert bridge migration is idempotent
        run: python tools/apply_newbie_bridges.py --check

      - name: Assert canonical Java exact sync remains intact
        run: python tools/audit_java_solution_comments.py

      - name: Refresh 150-problem pedagogy audit
        run: python tools/audit_newbie_solutions.py --write

      - name: Commit migrated solutions and refreshed reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/*/*/solution.md docs/content/solution-newbie-audit.json docs/content/solution-newbie-audit.md
          git diff --cached --stat
          git commit -m "docs(solutions): apply newbie-first bridges to remaining 142 problems"
          git push origin HEAD:${GITHUB_REF_NAME}
