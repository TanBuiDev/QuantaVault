name: Temporary Source Sync Validation

on:
  push:
    branches:
      - feat/leetcode-content-migration

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch user-supplied source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = "TanBuiDev/leetcode"
          token = os.environ["GH_TOKEN"]
          blobs = {
              "/tmp/array-six.txt": "537fe91a5cf8013d31364618fc2f4af989c3d759",
              "/tmp/rpn-150.txt": "1baa18702832072f20c525a0a7db3034eb42992e",
          }
          for target, sha in blobs.items():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              Path(target).write_bytes(base64.b64decode(payload["content"]))
          PY

      - name: Sync user-supplied statements into raw sources
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def clean_trailing_whitespace(value: str) -> str:
              return "\n".join(line.rstrip() for line in value.splitlines()).rstrip()

          array_six = clean_trailing_whitespace(
              Path("/tmp/array-six.txt").read_text(encoding="utf-8")
          )
          rpn = clean_trailing_whitespace(
              Path("/tmp/rpn-150.txt").read_text(encoding="utf-8")
          )

          for filename in ("Array  String.txt", "raw/top-interview-150/Array  String.txt"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "88. Merge Sorted Array" not in text:
                  old_prefix = "Array / String\nMột số bài trước đó đã tạo trong đoạn chat.\n"
                  if text.startswith(old_prefix):
                      rest = text[len(old_prefix):]
                  elif text.startswith("Array / String\n"):
                      rest = text[len("Array / String\n"):]
                  else:
                      raise SystemExit(f"Unexpected Array/String header in {filename}")
                  text = (
                      "Array / String\n"
                      + array_six
                      + "\n-------------------------------------------------------------\n"
                      + rest
                  )
                  path.write_text(text, encoding="utf-8")

          for filename in ("Stack.txt", "raw/top-interview-150/Stack.txt"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "150. Evaluate Reverse Polish Notation" not in text:
                  matches = list(re.finditer(r"(?m)^155\. Min Stack\s*$", text))
                  if len(matches) != 2:
                      raise SystemExit(
                          f"Expected exactly two Min Stack blocks in {filename}, got {len(matches)}"
                      )
                  start = matches[1].start()
                  end = text.find("224. Basic Calculator", start)
                  if end < 0:
                      raise SystemExit(f"Could not find 224 block in {filename}")
                  text = text[:start] + rpn + "\n\n" + text[end:]
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Refresh 121 source provenance
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          raw_path = Path("raw/top-interview-150/Array  String.txt")
          data = raw_path.read_bytes()
          blob_sha = hashlib.sha1(f"blob {len(data)}\0".encode("utf-8") + data).hexdigest()

          meta_path = Path("problems/array-string/0121-best-time-to-buy-and-sell-stock/meta.yaml")
          lines = meta_path.read_text(encoding="utf-8").splitlines()
          replaced = 0
          for index, line in enumerate(lines):
              if line.lstrip().startswith("raw_blob_sha:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}raw_blob_sha: "{blob_sha}"'
                  replaced += 1
          if replaced != 1:
              raise SystemExit(f"Expected one raw_blob_sha line, found {replaced}")
          meta_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("121 raw_blob_sha:", blob_sha)
          PY

      - name: Run inventory tests
        run: python3 -m unittest tests.test_inventory -v

      - name: Regenerate inventory
        run: |
          cp data/migration-inventory.json /tmp/prior-inventory.json
          python3 tools/inventory.py --root . --output data/migration-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("data/migration-inventory.json")
          current = json.loads(current_path.read_text(encoding="utf-8"))
          prior = json.loads(Path("/tmp/prior-inventory.json").read_text(encoding="utf-8"))
          prior_by_id = {item["id"]: item for item in prior["problems"]}

          for item in current["problems"]:
              old = prior_by_id.get(item["id"], {})
              if old.get("canonical_path"):
                  item["canonical_path"] = old["canonical_path"]
              if old.get("solution_status") == "migrated-v2":
                  item["solution_status"] = "migrated-v2"
              if old.get("source_status") == "full-source" and item["source_status"] == "available":
                  item["source_status"] = "full-source"

          assert current["problem_count_detected"] == 150
          assert current["unique_problem_count"] == 150
          assert current["full_source_count"] == 150
          assert current["source_missing_count"] == 0
          assert current["duplicates"] == []
          assert [item["id"] for item in current["problems"][:7]] == [88, 27, 26, 80, 169, 189, 121]

          current_path.write_text(
              json.dumps(current, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("CONFIRMED: 150 unique IDs, 150 full-source, 0 source-missing, 0 duplicates")
          PY

      - name: Validate repository
        run: |
          python3 tools/inventory.py --self-test
          python3 tools/validate_content.py --root .
          git diff --check

      - name: Commit source sync and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Array  String.txt" "raw/top-interview-150/Array  String.txt" "Stack.txt" "raw/top-interview-150/Stack.txt" data/migration-inventory.json problems/array-string/0121-best-time-to-buy-and-sell-stock/meta.yaml
          git rm .github/workflows/tmp-source-sync-validation.yml
          git commit -m "chore: complete Top Interview 150 problem sources"
          git push origin HEAD:feat/leetcode-content-migration
