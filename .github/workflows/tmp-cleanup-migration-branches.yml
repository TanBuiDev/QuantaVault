name: Temporary migration branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed migration branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'leetcode-migration-cleanup',
          }

          branches = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f'{api}/repos/{repo}/branches?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(req) as response:
                  batch = json.load(response)
              if not batch:
                  break
              branches.extend(item['name'] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          targets = [
              branch for branch in branches
              if branch == 'feat/leetcode-content-migration'
              or branch.startswith('staging/migrate-')
              or branch.startswith('worker-b/')
          ]

          print(f'FOUND_TARGETS={len(targets)}')
          deleted = []
          for branch in targets:
              encoded = urllib.parse.quote(branch, safe='')
              req = urllib.request.Request(
                  f'{api}/repos/{repo}/git/refs/heads/{encoded}',
                  headers=headers,
                  method='DELETE',
              )
              with urllib.request.urlopen(req) as response:
                  if response.status != 204:
                      raise RuntimeError(f'Unexpected status deleting {branch}: {response.status}')
              deleted.append(branch)
              print(f'DELETED {branch}')

          print(f'DELETED_COUNT={len(deleted)}')
          if len(deleted) != len(targets):
              raise SystemExit('Not all target migration branches were deleted')
          PY
