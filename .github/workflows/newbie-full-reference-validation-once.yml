name: Newbie full reference validation once

on:
  push:
    branches:
      - content/newbie-first-solutions-150
    paths:
      - .github/workflows/newbie-full-reference-validation-once.yml

permissions:
  contents: write

jobs:
  validate-all-references:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository Python validation
        run: |
          python3 -m unittest tests.test_inventory tests.test_validate_content -v
          python3 tools/inventory.py --self-test
          python3 tools/validate_content.py --root .
          python3 tools/audit_java_solution_comments.py
          python3 tools/audit_solution_pedagogy.py
          python3 tools/apply_newbie_bridges.py --check
          python3 tools/audit_newbie_solutions.py --check
          git diff --check

      - name: Compile and run all 150 Java reference regressions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/java/*/TestSolution.java)
          if [ ${#tests[@]} -ne 150 ]; then
            echo "Expected 150 Java regression tests, found ${#tests[@]}" >&2
            exit 1
          fi
          count=0
          for test_file in "${tests[@]}"; do
            package_name="$(basename "$(dirname "$test_file")")"
            solution_file="$(find problems -path "*/${package_name}/Solution.java" -print -quit)"
            if [ -z "$solution_file" ]; then
              echo "Missing Solution.java for ${package_name}" >&2
              exit 1
            fi
            work="$(mktemp -d)"
            cp "$solution_file" "$work/Solution.java"
            cp "$test_file" "$work/TestSolution.java"
            (
              cd "$work"
              javac Solution.java TestSolution.java
              java TestSolution
            )
            rm -rf "$work"
            count=$((count + 1))
          done
          echo "PASS: ${count}/150 Java regression tests"

      - name: Remove one-shot workflow and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/newbie-full-reference-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): record completed 150-reference validation cleanup"
          git push origin HEAD:${GITHUB_REF_NAME}
