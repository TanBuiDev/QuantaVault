name: Final migration validation

on:
  push:
    branches:
      - feat/leetcode-content-migration

permissions:
  contents: read

jobs:
  diagnose-missing-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4

      - name: List all missing Java regression harnesses
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          inventory = json.loads((root / 'data' / 'migration-inventory.json').read_text(encoding='utf-8'))
          records = inventory.get('problems', [])
          if len(records) != 150:
              raise SystemExit(f'Expected 150 inventory records, got {len(records)}')

          missing_tests = []
          missing_packages = []
          for record in records:
              problem_id = int(record['id'])
              matches = sorted(root.glob(f'problems/*/{problem_id:04d}-*'))
              if len(matches) != 1:
                  missing_packages.append((problem_id, len(matches)))
                  continue
              problem_dir = matches[0]
              test_file = root / 'tests' / 'java' / problem_dir.name / 'TestSolution.java'
              if not test_file.is_file():
                  missing_tests.append((problem_id, problem_dir.name, test_file.as_posix()))

          print(f'CANONICAL_RECORDS={len(records)}')
          print(f'MISSING_PACKAGES={len(missing_packages)}')
          for problem_id, count in missing_packages:
              print(f'MISSING_PACKAGE {problem_id}: matches={count}')
          print(f'MISSING_JAVA_TESTS={len(missing_tests)}')
          for problem_id, package, path in missing_tests:
              print(f'MISSING_TEST {problem_id} {package} {path}')

          if missing_packages or missing_tests:
              raise SystemExit('Legacy regression harness backfill required')
          print('PASS: all 150 canonical problems have Java regression harnesses')
          PY
