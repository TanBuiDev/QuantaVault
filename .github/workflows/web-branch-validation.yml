name: Web branch validation

on:
  push:
    branches:
      - agent/web-all-in-one
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical content
        run: python tools/validate_content.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync remaining MVP dependencies
        if: github.event_name == 'push'
        working-directory: web
        run: |
          npm install --global npm@11
          if ! node -e "const p=require('./package.json'); process.exit(p.dependencies?.yaml && p.dependencies?.['react-markdown'] && p.dependencies?.['remark-gfm'] && p.dependencies?.['server-only'] && p.devDependencies?.['@playwright/test'] ? 0 : 1)"; then
            npm install yaml server-only react-markdown remark-gfm
            npm install --save-dev @playwright/test
          fi

      - name: Commit dependency graph when needed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): add remaining MVP dependencies"
            git push
          fi

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
