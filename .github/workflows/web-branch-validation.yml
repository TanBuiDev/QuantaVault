name: Web branch validation

on:
  push:
    branches:
      - agent/web-all-in-one
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical content
        run: python tools/validate_content.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize patched dependency lockfile
        if: github.event_name == 'push'
        working-directory: web
        run: |
          npm install --global npm@11
          npm install --package-lock-only

      - name: Commit normalized lockfile when needed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): normalize patched dependency lockfile"
            git push
          fi

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: web
        run: npx playwright test
