name: Temporary Refresh Inventory

on:
  push:
    branches:
      - feat/leetcode-content-migration

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run inventory parser tests
        run: python3 -m unittest tests.test_inventory -v

      - name: Diagnose regenerated inventory
        run: |
          python3 tools/inventory.py --root . --output /tmp/generated-inventory.json
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          generated = json.loads(Path('/tmp/generated-inventory.json').read_text(encoding='utf-8'))
          current = json.loads(Path('data/migration-inventory.json').read_text(encoding='utf-8'))
          expected_ids = {item['id'] for item in current['problems']}
          generated_ids = [item['id'] for item in generated['problems']]
          generated_set = set(generated_ids)

          print('COUNTS:', generated['problem_count_detected'], generated['unique_problem_count'], generated['full_source_count'], generated['source_missing_count'])
          print('MISSING_EXPECTED_IDS:', sorted(expected_ids - generated_set))
          print('UNEXPECTED_IDS:', sorted(generated_set - expected_ids))
          print('DUPLICATES_JSON:', json.dumps(generated['duplicates'], ensure_ascii=False))
          print('SOURCE_MISSING:')
          for item in generated['problems']:
              if item['source_status'] == 'source-missing':
                  print(f"  id={item['id']} file={item['raw_source_file']!r} order={item['source_order']} title={item['title']!r}")
          print('REPEATED_ID_COUNTS:', sorted((pid, count) for pid, count in Counter(generated_ids).items() if count > 1))
          PY
