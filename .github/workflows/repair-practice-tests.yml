name: One-time practice test repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused PracticeView and test repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected snippet not found in {path_str}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "web/src/features/practice/PracticeView.tsx",
              '''    if (tab === "solution" && hasSolution) {\n      updateProblem(content.id, { solutionViewed: true });\n    }\n  }''',
              '''    if (tab === "solution" && hasSolution) {\n      updateProblem(content.id, { solutionViewed: true });\n    }\n    if (tab === "interview" && hasInterview) {\n      updateProblem(content.id, { interviewViewed: true });\n    }\n  }''',
          )

          path = Path("web/src/features/practice/__tests__/PracticeView.test.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'expect(screen.getByRole("button", { name: /Copy Java solution/i })).toBeInTheDocument();',
              'expect(screen.getByRole("button", { name: /Copy Java/i })).toBeInTheDocument();',
              1,
          )
          text = text.replace(
              '''    const stored = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) ?? "null");\n    expect(stored.problems["121"].solutionViewed).toBe(true);''',
              '''    await waitFor(() => {\n      const stored = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) ?? "null");\n      expect(stored?.problems?.["121"]?.solutionViewed).toBe(true);\n    });''',
              1,
          )
          text = text.replace(
              '''    const stored = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) ?? "null");\n    expect(stored.problems["121"].interviewViewed).toBe(true);''',
              '''    await waitFor(() => {\n      const stored = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) ?? "null");\n      expect(stored?.problems?.["121"]?.interviewViewed).toBe(true);\n    });''',
              1,
          )
          old_progress = '''  it("persists status, bookmark, confidence, and personal notes", async () => {\n    renderPractice();\n    await waitFor(() => expect(screen.getByText("VISIBLE PROBLEM")).toBeInTheDocument());\n\n    fireEvent.click(screen.getByRole("button", { name: "Solved" }));\n    fireEvent.click(screen.getByRole("button", { name: /Bookmark/i }));\n    fireEvent.change(screen.getByLabelText("Confidence"), { target: { value: "5" } });\n    fireEvent.change(screen.getByLabelText("Personal notes"), {\n      target: { value: "Remember the running-minimum invariant." },\n    });\n\n    const stored = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) ?? "null");\n    expect(stored.problems["121"]).toMatchObject({\n      status: "solved",\n      bookmarked: true,\n      confidence: 5,\n      notes: "Remember the running-minimum invariant.",\n    });\n  });'''
          new_progress = '''  it("persists status and personal notes from the current practice UI", async () => {\n    renderPractice();\n    await waitFor(() => expect(screen.getByText("VISIBLE PROBLEM")).toBeInTheDocument());\n\n    fireEvent.click(screen.getByRole("button", { name: "Solved" }));\n    fireEvent.click(screen.getByRole("tab", { name: "Notes" }));\n    fireEvent.change(screen.getByLabelText(/Ghi chú cá nhân/i), {\n      target: { value: "Remember the running-minimum invariant." },\n    });\n\n    await waitFor(() => {\n      const stored = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) ?? "null");\n      expect(stored?.problems?.["121"]).toMatchObject({\n        status: "solved",\n        bookmarked: false,\n        confidence: null,\n        notes: "Remember the running-minimum invariant.",\n      });\n    });\n  });'''
          if old_progress not in text:
              raise RuntimeError("Expected legacy progress test block not found")
          text = text.replace(old_progress, new_progress, 1)

          old_nav = '''  it("uses canonical previous and next destinations", async () => {\n    renderPractice();\n    await waitFor(() => expect(screen.getByText("VISIBLE PROBLEM")).toBeInTheDocument());\n\n    expect(screen.getByRole("link", { name: /Previous.*Rotate Array/i })).toHaveAttribute(\n      "href",\n      "/problems/189",\n    );\n    expect(\n      screen.getByRole("link", { name: /Next.*Best Time to Buy and Sell Stock II/i }),\n    ).toHaveAttribute("href", "/problems/122");\n  });'''
          new_nav = '''  it("uses canonical previous and next destinations in Classic layout", async () => {\n    localStorage.setItem("preferred_layout_mode", "classic");\n    renderPractice();\n    await waitFor(() => expect(screen.getByRole("region", { name: "Study content" })).toBeInTheDocument());\n\n    expect(screen.getByRole("link", { name: /#189 Rotate Array/i })).toHaveAttribute(\n      "href",\n      "/problems/189",\n    );\n    expect(\n      screen.getByRole("link", { name: /#122 Best Time to Buy and Sell Stock II/i }),\n    ).toHaveAttribute("href", "/problems/122");\n  });'''
          if old_nav not in text:
              raise RuntimeError("Expected legacy navigation test block not found")
          text = text.replace(old_nav, new_nav, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("web/src/features/practice/__tests__/PracticeLayout.test.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'import { render, screen } from "@testing-library/react";',
              'import { render, screen, waitFor } from "@testing-library/react";',
              1,
          )
          old_layout = '''describe("Practice workspace layout", () => {\n  it("separates study content from the personal progress panel", () => {\n    render(\n      <ToastProvider>\n        <ConfirmProvider>\n          <ProgressProvider>\n            <PracticeView\n              content={content}\n              hints={["## Hint 1\\nThink first."]}\n              previous={{ id: 189, title: "Rotate Array" }}\n              next={{ id: 122, title: "Best Time to Buy and Sell Stock II" }}\n              sectionName="Array / String"\n            />\n          </ProgressProvider>\n        </ConfirmProvider>\n      </ToastProvider>,\n    );\n\n    expect(screen.getByRole("region", { name: "Study content" })).toBeInTheDocument();\n    expect(screen.getByRole("complementary", { name: "Study progress" })).toBeInTheDocument();\n    expect(screen.getByRole("link", { name: "Open on LeetCode" })).toHaveAttribute("target", "_blank");\n    expect(screen.getByRole("link", { name: "Open on LeetCode" })).toHaveAttribute("rel", "noreferrer");\n  });\n});'''
          new_layout = '''describe("Practice workspace layout", () => {\n  it("separates study content from problem information in Classic layout", async () => {\n    localStorage.setItem("preferred_layout_mode", "classic");\n\n    render(\n      <ToastProvider>\n        <ConfirmProvider>\n          <ProgressProvider>\n            <PracticeView\n              content={content}\n              hints={["## Hint 1\\nThink first."]}\n              previous={{ id: 189, title: "Rotate Array" }}\n              next={{ id: 122, title: "Best Time to Buy and Sell Stock II" }}\n              sectionName="Array / String"\n            />\n          </ProgressProvider>\n        </ConfirmProvider>\n      </ToastProvider>,\n    );\n\n    await waitFor(() => expect(screen.getByRole("region", { name: "Study content" })).toBeInTheDocument());\n    expect(screen.getByRole("complementary", { name: "Problem information" })).toBeInTheDocument();\n    const leetcodeLink = screen.getByRole("link", { name: /LeetCode/i });\n    expect(leetcodeLink).toHaveAttribute("target", "_blank");\n    expect(leetcodeLink).toHaveAttribute("rel", "noreferrer");\n  });\n});'''
          if old_layout not in text:
              raise RuntimeError("Expected legacy PracticeLayout test block not found")
          path.write_text(text.replace(old_layout, new_layout, 1), encoding="utf-8")
          PY

      - name: Commit focused repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/features/practice/PracticeView.tsx web/src/features/practice/__tests__
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'fix(web): restore interview progress and align practice tests'
          git push origin HEAD:main
