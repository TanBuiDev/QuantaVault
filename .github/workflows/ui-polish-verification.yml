name: UI Polish Verification Report

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/ui-polish-verification.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Validate canonical content
        id: canonical
        continue-on-error: true
        run: python tools/validate_content.py

      - name: Install dependencies
        id: install
        continue-on-error: true
        working-directory: web
        run: npm ci

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: web
        run: npm run lint

      - name: Unit tests
        id: unit
        continue-on-error: true
        working-directory: web
        run: npm test

      - name: Build
        id: build
        continue-on-error: true
        working-directory: web
        run: npm run build

      - name: Install Playwright Chromium
        id: playwright_install
        continue-on-error: true
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        id: e2e
        continue-on-error: true
        working-directory: web
        run: npx playwright test

      - name: Write verification report
        if: always()
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT_INSTALL: ${{ steps.playwright_install.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p docs/superpowers/verification
          cat > docs/superpowers/verification/ui-polish-latest.txt <<EOF
          source_sha=${GITHUB_SHA}
          canonical=${CANONICAL}
          npm_ci=${INSTALL}
          audit=${AUDIT}
          lint=${LINT}
          unit=${UNIT}
          build=${BUILD}
          playwright_install=${PLAYWRIGHT_INSTALL}
          e2e=${E2E}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/verification/ui-polish-latest.txt
          git commit -m "chore(web): record UI polish verification [skip ci]"
          git push
