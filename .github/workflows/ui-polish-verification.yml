name: UI Polish Verification Status

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/ui-polish-verification.yml"

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Validate canonical content
        id: canonical
        continue-on-error: true
        run: python tools/validate_content.py

      - name: Install dependencies
        id: install
        continue-on-error: true
        working-directory: web
        run: npm ci

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: web
        run: npm run lint

      - name: Unit tests
        id: unit
        continue-on-error: true
        working-directory: web
        run: npm test

      - name: Build
        id: build
        continue-on-error: true
        working-directory: web
        run: npm run build

      - name: Install Playwright Chromium
        id: playwright_install
        continue-on-error: true
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        id: e2e
        continue-on-error: true
        working-directory: web
        run: npx playwright test

      - name: Publish verification statuses
        if: always()
        env:
          TOKEN: ${{ github.token }}
          CANONICAL: ${{ steps.canonical.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT_INSTALL: ${{ steps.playwright_install.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          post_status() {
            outcome="$1"
            context="$2"
            description="$3"
            state="failure"
            if [ "$outcome" = "success" ]; then state="success"; fi
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer ${TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}"
          }

          post_status "$CANONICAL" "ui-polish/canonical" "Canonical content validation: $CANONICAL"
          post_status "$INSTALL" "ui-polish/npm-ci" "Clean dependency install: $INSTALL"
          post_status "$AUDIT" "ui-polish/audit" "Production dependency audit: $AUDIT"
          post_status "$LINT" "ui-polish/lint" "ESLint: $LINT"
          post_status "$UNIT" "ui-polish/unit" "Vitest unit suite: $UNIT"
          post_status "$BUILD" "ui-polish/build" "Next.js production build: $BUILD"
          post_status "$PLAYWRIGHT_INSTALL" "ui-polish/playwright-install" "Playwright Chromium install: $PLAYWRIGHT_INSTALL"
          post_status "$E2E" "ui-polish/e2e" "Playwright end-to-end suite: $E2E"

          overall="success"
          for outcome in "$CANONICAL" "$INSTALL" "$AUDIT" "$LINT" "$UNIT" "$BUILD" "$PLAYWRIGHT_INSTALL" "$E2E"; do
            if [ "$outcome" != "success" ]; then overall="failure"; fi
          done
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${overall}\",\"context\":\"ui-polish/release-gate\",\"description\":\"UI polish release gate: ${overall}\"}"
