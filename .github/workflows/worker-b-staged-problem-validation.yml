name: Worker B staged problem validation

on:
  push:
    branches:
      - 'worker-b/staging/migrate-*'

permissions:
  contents: write

jobs:
  validate-and-promote-worker-b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate Worker B problem commit shape
        env:
          STAGING_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          branch = os.environ['STAGING_BRANCH']
          match = re.fullmatch(r'worker-b/staging/migrate-(\d{4})', branch)
          if not match:
              raise SystemExit(f'Unexpected Worker B staging branch: {branch}')
          problem_id = int(match.group(1))

          matches = sorted(Path('problems').glob(f'*/{problem_id:04d}-*'))
          if len(matches) != 1:
              raise SystemExit(f'Expected one canonical folder for {problem_id}, got {matches}')
          problem_dir = matches[0]
          package_name = problem_dir.name
          test_dir = Path('tests/java') / package_name

          required_problem_files = {
              'meta.yaml',
              'problem.md',
              'hints.md',
              'solution.md',
              'interview.md',
              'Solution.java',
              'cases.yaml',
          }
          missing = sorted(
              name for name in required_problem_files
              if not (problem_dir / name).is_file()
          )
          if missing:
              raise SystemExit(
                  f'Missing required V2 files for {problem_id}: {", ".join(missing)}'
              )
          if not (test_dir / 'TestSolution.java').is_file():
              raise SystemExit(f'Missing Java test: {test_dir}/TestSolution.java')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'],
              text=True,
          ).splitlines()
          allowed_prefixes = (
              problem_dir.as_posix() + '/',
              test_dir.as_posix() + '/',
          )
          unexpected = [
              path for path in changed
              if not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(
                  'Worker B problem commit contains files outside its problem package: '
                  + ', '.join(unexpected)
              )

          print(f'Worker B staged problem {problem_id}: {problem_dir}')
          print('Changed files:')
          for path in changed:
              print(f'  {path}')
          PY

      - name: Run Python validation
        run: |
          python3 -m unittest tests.test_inventory tests.test_validate_content -v
          python3 tools/inventory.py --self-test
          python3 tools/validate_content.py --root .
          git diff --check

      - name: Compile and run full Java reference regression
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/java/*/TestSolution.java)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No Java regression tests found" >&2
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            test_dir="$(dirname "$test_file")"
            package_name="$(basename "$test_dir")"
            solution_file="$(find problems -path "*/${package_name}/Solution.java" -print -quit)"
            if [ -z "$solution_file" ]; then
              echo "Missing Solution.java for ${package_name}" >&2
              exit 1
            fi
            work="$(mktemp -d)"
            cp "$solution_file" "$work/Solution.java"
            cp "$test_file" "$work/TestSolution.java"
            (
              cd "$work"
              javac Solution.java TestSolution.java
              java TestSolution
            )
            rm -rf "$work"
          done

      - name: Promote validated commit to Worker B branch
        env:
          TARGET_BRANCH: worker-b/reverse-migration
        run: |
          set -euo pipefail

          parent_sha="$(git rev-parse HEAD^)"
          git fetch origin "$TARGET_BRANCH"
          remote_target="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [ "$parent_sha" != "$remote_target" ]; then
            echo "Worker B branch advanced while validation was running." >&2
            echo "parent=$parent_sha target=$remote_target" >&2
            exit 1
          fi

          validated_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PROMOTED_COMMIT=$validated_sha"
